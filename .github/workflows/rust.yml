name: rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo +1.98.1 fmt --all -- --check
      - name: Test
        run: cargo +1.98.1 test --all-features
      - name: Check without Ed25519
        run: cargo +1.98.1 check --no-default-features
      - name: Lint
        run: cargo +1.98.1 clippy --all-targets --all-features -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.98.1 doc --all-features --no-deps
