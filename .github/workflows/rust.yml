name: rust

# Runs the tests, including the signature-threshold tests, on a pinned stable
# toolchain, and builds the crate without its Ed25519 feature. Format, lint,
# docs and the name scan run in test.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test
        run: cargo +1.98.1 test --all-features
      - name: Check without Ed25519
        run: cargo +1.98.1 check --no-default-features
