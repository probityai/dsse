name: policy

# Release policy checks, each a job of its own so a failure names its rule.
#
# msrv: the crate builds and its tests pass on the rust-version Cargo.toml
#   declares (1.85). Raising it is a breaking change for downstream callers, so
#   it happens in its own commit with this job green.
# semver: cargo-semver-checks compares the public API against the newest
#   release on crates.io and fails when a change needs a larger version bump
#   than Cargo.toml carries.
# vet: every dependency in Cargo.lock is either covered by an imported audit
#   or listed as an exemption in supply-chain/config.toml. A new or updated
#   dependency fails here until someone audits it or records why it is exempt.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The declared rust-version builds and passes the tests
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" test --locked --all-features
          cargo +"$msrv" check --locked --no-default-features

  semver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2

  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-vet
        run: cargo install cargo-vet --version 0.10.2 --locked
      - name: Every dependency is audited or exempted
        run: cargo vet --locked
